name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build
        run: pyinstaller --onefile --windowed computer_guy_gui.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComputerGuy2-EXE
          path: dist/computer_guy_gui.exe
